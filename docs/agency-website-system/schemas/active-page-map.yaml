# Active Page Map — handoff schema
# Produced by: Client Intake Agent (1) + Content Brief Agent (3)
# Consumed by: Site Audit Agent (2), Copywriting (4), Design (5), Build (6), QA (7)
#
# Purpose: the final proposed page set for one client, with per-page build eligibility.
# Pages map to services by stable ID / canonical URL first, display name only as fallback.

meta:
  client: ""
  source_snapshot: ""                # intake sheet URL, tab, read date
  master_template_ref: ""            # e.g. restoration-seo-master-template URL
  primary_service_page_target_area: ""   # largest approved market — required before root/non-city service copy
  status: Draft                      # Draft | Ready For Review | Approved
  approved_by: ""

pages:
  - page_id: ""                      # stable ID or canonical URL key — required
    url: ""                          # canonical URL from master URL schema
    page_type: ""                    # homepage | parent_hub | service | city_hub | city_service | contact | about | reviews | legal | utility
    parent_hub: ""                   # page_id of parent, when applicable
    title_direction: ""              # from brief when one exists
    service_ref: ""                  # stable service/sub-service ID from verified service matrix
    city: ""                         # for city/city-service pages
    status: Proposed                 # Proposed | Client Requested | Approved | Needs Info | Ready For Content | Ready To Build | Built | QA Passed | Launched | Redirect Verified | Do Not Build
    brief:
      required: true                 # false for operational pages (§ Content Brief Agent page-type rules)
      brief_ref: ""                  # Google Doc URL of approved master brief, when assigned
      brief_status: ""               # Assigned | New Brief Needed | No Brief Required | Needs SEO Decision
    navigation_inclusion: []         # §23: header | footer | sidebar | hub_listing | sitemap_only | hidden_approved
    schema_plan: []                  # §22 page-type schemas
    blockers: []                     # e.g. "sub-service Needs Client Confirmation", "claim unverified"

excluded_pages:                      # recommended-but-not-built, with reasons (feeds client review packet)
  - page_id: ""
    reason: ""

blockers: []                         # map-level blockers, each with owner
